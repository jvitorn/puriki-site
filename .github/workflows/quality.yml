name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Simula o deploy real de project-site do GitHub Pages, para que
      # este gate capture regressões de base-path/canonical/localhost
      # antes de chegarem à main — os mesmos valores que o deploy-pages.yml
      # usa no build de produção. Este workflow nunca roda
      # `pnpm release:fetch`: sempre valida o baseline commitado
      # `{ "available": false }` (ver app/generated/release.json), então o
      # CI de PR fica determinístico e independente da API do GitHub. A
      # release real, publicada atualmente, é validada separadamente pelo
      # workflow de deploy, logo antes de publicar.
      BASE_PATH: /puriki-site/
      SITE_URL: https://jvitorn.github.io/puriki-site/
    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build (saída estática em estilo produção)
        run: pnpm build

      - name: Validar saída estática
        run: pnpm validate:static
