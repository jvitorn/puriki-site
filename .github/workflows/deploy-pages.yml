name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Reserved for a future purikuki workflow to trigger a rebuild after a
  # stable release is published. No sender exists yet in purikuki (see
  # docs/planos/PHASE_04_DOWNLOAD_RELEASES.md) — this only declares the
  # event type the site is prepared to accept; it changes no current
  # behavior. The site always re-fetches release data itself below rather
  # than trusting a payload from the dispatching workflow.
  repository_dispatch:
    types:
      - puriki-release-published

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch latest stable release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:fetch

      - name: Build static site
        env:
          BASE_PATH: /puriki-site/
          SITE_URL: https://jvitorn.github.io/puriki-site/
        run: pnpm build

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
