name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Reservado para um futuro workflow do jvitorn/puriki disparar um
  # rebuild depois que uma release estável é publicada. Ainda não existe
  # emissor no jvitorn/puriki (ver docs/planos/PHASE_04_DOWNLOAD_RELEASES.md)
  # — isso só declara o tipo de evento que o site está preparado para
  # aceitar; não muda nenhum comportamento atual. O site sempre rebusca os
  # dados de release por conta própria (abaixo), nunca confia no payload
  # do workflow que dispara o evento.
  repository_dispatch:
    types:
      - puriki-release-published

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gate de qualidade (format, lint, typecheck, tests)
        # Mesmo gate que o workflow Quality (.github/workflows/quality.yml)
        # roda em todo PR para main — um gate de qualidade quebrado nunca
        # pode publicar. Consolidado como `pnpm verify` para não duplicar
        # quatro steps de YAML entre os dois workflows, num projeto deste
        # tamanho (ver docs/planos/PHASE_06_TESTING_CI_DEPLOY.md).
        run: pnpm verify

      - name: Buscar metadados da última release estável
        # jvitorn/puriki é público; isso é um único GET não autenticado
        # por deploy, bem abaixo do limite de taxa não autenticado do
        # GitHub, então o GITHUB_TOKEN do repositório não é necessário
        # aqui. Um RELEASE_FETCH_TOKEN opcional (não-VITE_*, nunca exposto
        # ao navegador) continua suportado pelo script para uso local ou
        # uma necessidade futura explícita — ver scripts/fetch-release.ts.
        # Uma release estável sem um artifact Android obrigatório
        # (arm64-v8a/universal) faz este step falhar de forma clara, em
        # vez de publicar uma seção de Download incompleta — ver
        # ReleaseParseError em app/lib/releases/parse-github-release.ts.
        # Se este step falhar, o site publicado anteriormente continua no
        # ar sem ser tocado.
        run: pnpm release:fetch

      - name: Gerar site estático
        env:
          BASE_PATH: /puriki-site/
          SITE_URL: https://jvitorn.github.io/puriki-site/
        run: pnpm build

      - name: Validar saída estática
        env:
          BASE_PATH: /puriki-site/
          SITE_URL: https://jvitorn.github.io/puriki-site/
        run: pnpm validate:static

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
